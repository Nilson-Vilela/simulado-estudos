<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plataforma de Simulado</title>

<script src="https://cdn.tailwindcss.com"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>



<body class="bg-gray-100 min-h-screen">

<!-- HOME -->
<section id="home"
class="min-h-screen flex items-center justify-center bg-cover bg-center"
style="background-image:url('https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=1600&q=80');">

  <div class="bg-black/60 text-white p-8 rounded-xl text-center max-w-md">

    <h1 class="text-3xl md:text-4xl font-bold mb-4">
      📘 Simulado Online
    </h1>

    <p class="mb-6 text-lg">
      Estude e se prepare para suas provas
    </p>

    <button onclick="abrirLogin()"
    class="bg-blue-500 hover:bg-blue-600 px-6 py-3 rounded-xl font-bold">
      Entrar
    </button>

  </div>

</section>

<!-- LOGIN -->
<section id="login" class="hidden flex items-center justify-center min-h-screen">
<div class="bg-white p-6 rounded-xl shadow w-full max-w-md">

<h2 class="text-2xl font-bold text-center mb-4">Login</h2>

<input id="email" class="w-full border p-2 mb-2 rounded" placeholder="Email">
<input id="senha" type="password" class="w-full border p-2 mb-3 rounded" placeholder="Senha">

<button onclick="loginEmail()" class="bg-blue-500 w-full py-2 text-white rounded mb-2">Entrar</button>
<button onclick="loginGoogle()" class="bg-red-500 w-full py-2 text-white rounded">Google</button>

<p class="text-center mt-3 text-sm">
<a href="#" onclick="registrar()" class="text-blue-600">Criar conta</a>
</p>

</div>
</section>

<!-- ALUNO -->
<section id="aluno" class="hidden p-4 max-w-3xl mx-auto">

<h2 class="text-2xl font-bold mb-4">Área do Aluno</h2>

<div class="space-y-3">
<select id="disciplinaAluno" class="w-full border p-2 rounded mb-2">
  <option value="Matemática">Matemática</option>
  <option value="Português">Português</option>
  <option value="História">História</option>
  <option value="Geografia">Geografia</option>
  <option value="Ciências">Ciências</option>
</select>

<button onclick="iniciarSimulado()" class="btn bg-blue-600 text-white">
  🎯 Iniciar Simulado
</button>
<button onclick="historico()" class="btn">📊 Histórico</button>
<button onclick="ranking()" class="btn">🏆 Ranking</button>
<button onclick="logout()" class="btn bg-red-500 text-white">Sair</button>
</div>

<div id="conteudoAluno" class="mt-5"></div>

</section>

<!-- ADMIN -->
<section id="admin" class="hidden p-4 max-w-4xl mx-auto">

<h2 class="text-2xl font-bold mb-4">Painel do Professor</h2>

<div class="bg-white p-4 rounded-xl shadow mb-4 space-y-2">
<select id="disciplina" class="w-full border p-2 rounded">
  <option value="">Selecione a disciplina</option>
  <option value="Matemática">Matemática</option>
  <option value="Português">Português</option>
  <option value="História">História</option>
  <option value="Geografia">Geografia</option>
  <option value="Ciências">Ciências</option>
</select>

<input id="perg" class="w-full border p-2 rounded" placeholder="Pergunta">

<input id="opA" class="w-full border p-2 rounded" placeholder="Alternativa A">
<input id="opB" class="w-full border p-2 rounded" placeholder="Alternativa B">
<input id="opC" class="w-full border p-2 rounded" placeholder="Alternativa C">
<input id="opD" class="w-full border p-2 rounded" placeholder="Alternativa D">

<select id="resp" class="w-full border p-2 rounded">
<option>A</option>
<option>B</option>
<option>C</option>
<option>D</option>
</select>

<button onclick="salvarQuestao()"
class="bg-green-500 text-white w-full py-2 rounded">
Salvar Questão
</button>

</div>

<button onclick="logout()" class="btn bg-red-500 text-white mb-3">Sair</button>

<div id="listaQuestoes"></div>

</section>

<script>

/**************** FIREBASE ****************/

const firebaseConfig = {
  apiKey: "AIzaSyBzrrvInMw45pNN3P-5_IpAK6IrKZNXEG4",
  authDomain: "simulado-a0d70.firebaseapp.com",
  projectId: "simulado-a0d70",
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

const EMAIL_PROF = "nilsonsvilela@gmail.com";

/**************** AUTH ****************/
function loginEmail(){
  auth.signInWithEmailAndPassword(
    email.value,
    senha.value
  ).then(() => {
    // Depois de logar com sucesso, decide o destino:
    if(usuarioAtual.email === EMAIL_PROF){
      mostrar('admin');
      carregarQuestoes();
    } else {
      mostrar('aluno');
    }
  }).catch(e => alert(e.message));
}


function abrirLogin(){
  mostrar('login');
}

function registrar(){
  auth.createUserWithEmailAndPassword(
    email.value,
    senha.value
  ).catch(e=>alert(e.message));
}

function loginGoogle(){
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider)
    .then(()=> {
      if(usuarioAtual.email === EMAIL_PROF){
        mostrar('admin');
        carregarQuestoes();
      } else {
        mostrar('aluno');
      }
    })
    .catch(e => alert(e.message));
}

function logout(){

  auth.signOut()
    .then(()=>{

      mostrar('home');

      // Limpa campos
      if(document.getElementById('email')) email.value="";
      if(document.getElementById('senha')) senha.value="";

      alert("Você saiu do sistema.");

    })
    .catch((erro)=>{
      alert("Erro ao sair: " + erro.message);
    });

}


let usuarioAtual = null;

// Sempre que o estado de login mudar, guardamos o usuário
auth.onAuthStateChanged(user => {
  usuarioAtual = user;
  // Não fazemos nada automático aqui
  // O usuário só vai entrar nas áreas internas depois de clicar em "Entrar"
});


/**************** UI ****************/
function mostrar(id){

  ['home','login','aluno','admin'].forEach(s=>{
    document.getElementById(s).classList.add('hidden');
  });

  document.getElementById(id).classList.remove('hidden');
}

/**************** PROFESSOR ****************/
function salvarQuestao(){

  const user = auth.currentUser;

  if(!user){
    alert("Você precisa estar logado!");
    mostrar('login');
    return;
  }

  // Pegando elementos corretamente
  const disciplina = document.getElementById('disciplina').value;
  const pergunta = document.getElementById('perg').value.trim();
  const alternativaA = document.getElementById('opA').value.trim();
  const alternativaB = document.getElementById('opB').value.trim();
  const alternativaC = document.getElementById('opC').value.trim();
  const alternativaD = document.getElementById('opD').value.trim();
  const resposta = document.getElementById('resp').value;

  // Validação
  if(
    !disciplina ||
    !pergunta ||
    !alternativaA ||
    !alternativaB ||
    !alternativaC ||
    !alternativaD ||
    !resposta
  ){
    alert("Preencha todos os campos!");
    return;
  }

 if(questaoEditandoId){

  db.collection('questoes').doc(questaoEditandoId).update({
    disciplina,
    pergunta,
    a: alternativaA,
    b: alternativaB,
    c: alternativaC,
    d: alternativaD,
    correta: resposta
  })
  .then(()=>{
    alert("✅ Questão atualizada!");

    questaoEditandoId = null;

    document.querySelector("button[onclick='salvarQuestao()']")
      .innerText = "Salvar Questão";

    limparFormulario();
  });

}else{

  db.collection('questoes').add({
    disciplina,
    pergunta,
    a: alternativaA,
    b: alternativaB,
    c: alternativaC,
    d: alternativaD,
    correta: resposta,
    criadoEm: firebase.firestore.FieldValue.serverTimestamp(),
    autor: user.email
  })
  .then(()=>{
    alert("✅ Questão salva!");
    limparFormulario();
  });

}

  .then(()=>{

    alert("✅ Questão salva com sucesso!");

    // Limpar campos
    document.getElementById('disciplina').value="";
    document.getElementById('perg').value="";
    document.getElementById('opA').value="";
    document.getElementById('opB').value="";
    document.getElementById('opC').value="";
    document.getElementById('opD').value="";
    document.getElementById('resp').value="A";

  })
  .catch((erro)=>{

    console.error(erro);
    alert("❌ Erro ao salvar: " + erro.message);

  });
}

function carregarQuestoes(){

  db.collection('questoes').onSnapshot(snap=>{

    let html='';

    snap.forEach(doc=>{

      const q=doc.data();

      html+=`
      <div class="bg-white p-3 rounded shadow mb-2">
        <p><b>${q.pergunta}</b></p>
        <p>A) ${q.a}</p>
        <p>B) ${q.b}</p>
        <p>C) ${q.c}</p>
        <p>D) ${q.d}</p>
        <p>✔ ${q.correta}</p>

        <div class="space-x-2 mt-2">
          <button onclick="editar('${doc.id}')" class="btn">✏️ Editar</button>
          <button onclick="excluir('${doc.id}')" class="btn bg-red-500 text-white">🗑 Excluir</button>
        </div>
      </div>`;

    });

    listaQuestoes.innerHTML=html;
  });
}

function excluir(id){
  if(confirm('Excluir?')){
    db.collection('questoes').doc(id).delete();
  }
}



let questaoEditandoId = null;

function editar(id){

  db.collection('questoes').doc(id).get().then(doc=>{

    const q = doc.data();

    document.getElementById('disciplina').value = q.disciplina || "";
    document.getElementById('perg').value = q.pergunta;
    document.getElementById('opA').value = q.a;
    document.getElementById('opB').value = q.b;
    document.getElementById('opC').value = q.c;
    document.getElementById('opD').value = q.d;
    document.getElementById('resp').value = q.correta;

    questaoEditandoId = id;

    // Troca texto do botão
    document.querySelector("button[onclick='salvarQuestao()']")
      .innerText = "Atualizar Questão";

  });
}

/**************** ALUNO ****************/

let questoes=[];
let atual=0;
let pontos=0;

function iniciarSimulado(){

  const disciplinaEscolhida = document.getElementById('disciplinaAluno').value;

  db.collection('questoes')
  .where('disciplina','==',disciplinaEscolhida)
  .get()
  .then(s=>{

    questoes=[];

    s.forEach(d=>questoes.push(d.data()));

    atual=0;
    pontos=0;

    mostrarQuestao();
  });
}

function mostrarQuestao(){

  if(atual>=questoes.length){
    salvarHistorico();
    conteudoAluno.innerHTML=`
      <div class="bg-gradient-to-r from-yellow-400 to-yellow-600 p-6 rounded-xl text-center text-black shadow-xl">
        <h2 class="text-3xl font-bold">🏆 Resultado Final</h2>
        <p class="text-2xl mt-3">${pontos} / ${questoes.length}</p>
      </div>`;
    return;
  }

  const q=questoes[atual];

  conteudoAluno.innerHTML=`
  <div class="bg-gradient-to-br from-blue-900 via-indigo-900 to-purple-900 p-6 rounded-2xl shadow-2xl text-white">

    <div class="text-center text-yellow-400 text-xl font-bold mb-4">
      Pergunta ${atual+1}
    </div>

    <div class="bg-black/60 p-4 rounded-xl mb-5 text-lg font-semibold">
      ${q.pergunta}
    </div>

    <div class="grid gap-3">
      <button class="opcao" onclick="resp('A')">A) ${q.a}</button>
      <button class="opcao" onclick="resp('B')">B) ${q.b}</button>
      <button class="opcao" onclick="resp('C')">C) ${q.c}</button>
      <button class="opcao" onclick="resp('D')">D) ${q.d}</button>
    </div>

  </div>`;
}

function resp(r){

  if(r===questoes[atual].correta) pontos++;

  atual++;
  mostrarQuestao();
}

function salvarHistorico(){

  const user=auth.currentUser;

  db.collection('historico').add({
    aluno:user.email,
    pontos,
    total:questoes.length,
    data:new Date()
  });
}

function historico(){

  const user=auth.currentUser;

  db.collection('historico')
  .where('aluno','==',user.email)
  .get()
  .then(s=>{

    let h='<h3 class="font-bold mb-2">Histórico</h3>';

    s.forEach(d=>{
      const r=d.data();
      h+=`<p>${r.pontos}/${r.total}</p>`;
    });

    conteudoAluno.innerHTML=h;
  });
}

function ranking(){

  db.collection('historico')
  .orderBy('pontos','desc')
  .limit(10)
  .get()
  .then(s=>{

    let r='<h3 class="font-bold mb-2">Ranking</h3>';

    s.forEach(d=>{
      const x=d.data();
      r+=`<p>${x.aluno} - ${x.pontos}</p>`;
    });

    conteudoAluno.innerHTML=r;
  });
}

window.onload = function(){
  mostrar('home');
};

function limparFormulario(){
  document.getElementById('disciplina').value="";
  document.getElementById('perg').value="";
  document.getElementById('opA').value="";
  document.getElementById('opB').value="";
  document.getElementById('opC').value="";
  document.getElementById('opD').value="";
  document.getElementById('resp').value="A";
}

</script>

<style>
.btn{
  width:100%;
  border:1px solid #ccc;
  padding:8px;
  border-radius:8px;
  margin-bottom:6px;
}


.opcao{
  width:100%;
  padding:12px;
  border-radius:12px;
  font-weight:bold;
  background:linear-gradient(45deg,#1e3a8a,#2563eb);
  color:white;
  transition:0.3s;
  border:none;
}

.opcao:hover{
  background:linear-gradient(45deg,#facc15,#f59e0b);
  color:black;
  transform:scale(1.03);
}


</style>

</body>
</html>
